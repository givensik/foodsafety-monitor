<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>식품안전나라 신규 등록 업체 실시간 모니터</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <span class="flex h-3 w-3 relative">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
        </span>
        <h1 class="text-lg font-bold text-slate-900 tracking-tight flex items-center gap-2">
          <i class="fa-solid fa-utensils text-indigo-600"></i>
          식품안전나라 실시간 신규 등록 모니터
        </h1>
      </div>
      <div class="flex items-center gap-2">
        <button id="refreshBtn" onclick="fetchData()" class="inline-flex items-center gap-1.5 px-3.5 py-1.5 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 rounded-lg text-sm font-semibold transition">
          <i id="refreshIcon" class="fa-solid fa-rotate-right"></i>
          <span>새로고침</span>
        </button>
        <button onclick="downloadCSV()" class="inline-flex items-center gap-1.5 px-3.5 py-1.5 bg-slate-900 text-white hover:bg-slate-800 rounded-lg text-sm font-semibold transition shadow-sm">
          <i class="fa-solid fa-file-arrow-down"></i>
          <span>CSV 다운로드</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">

    <!-- Overview & Control Bar -->
    <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
      <!-- Tabs -->
      <div class="flex bg-slate-100 p-1 rounded-xl text-sm font-medium self-start">
        <button onclick="setRegion('seoul')" id="tab-seoul" class="px-4 py-2 rounded-lg bg-white text-indigo-600 shadow-sm transition">서울</button>
        <button onclick="setRegion('gyeonggi')" id="tab-gyeonggi" class="px-4 py-2 rounded-lg text-slate-600 hover:text-slate-900 transition">경기</button>
        <button onclick="setRegion('all')" id="tab-all" class="px-4 py-2 rounded-lg text-slate-600 hover:text-slate-900 transition">전국</button>
      </div>

      <!-- Search & Info -->
      <div class="flex flex-wrap items-center gap-3">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
          <input type="text" id="searchInput" oninput="filterData()" placeholder="상호명, 구청, 주소 검색..." class="pl-9 pr-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 w-64">
        </div>
        <div class="text-xs text-slate-500">
          마지막 갱신: <span id="lastUpdated" class="font-medium text-slate-700">-</span>
        </div>
      </div>
    </div>

    <!-- Table Card -->
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-slate-200 text-sm">
          <thead class="bg-slate-50 text-slate-600 font-semibold text-xs uppercase tracking-wider">
            <tr>
              <th scope="col" class="py-3.5 pl-6 pr-3 text-left">순번</th>
              <th scope="col" class="px-3 py-3.5 text-left">식약처 허가일(PRMS_DT)</th>
              <th scope="col" class="px-3 py-3.5 text-left">최초 감지시각</th>
              <th scope="col" class="px-3 py-3.5 text-left">인허가번호</th>
              <th scope="col" class="px-3 py-3.5 text-left">상호명(업체명)</th>
              <th scope="col" class="px-3 py-3.5 text-left">업종</th>
              <th scope="col" class="px-3 py-3.5 text-left">관할지자체</th>
              <th scope="col" class="px-3 py-3.5 text-left">상세 소재지</th>
              <th scope="col" class="px-3 py-3.5 text-left">대표자</th>
              <th scope="col" class="px-3 py-3.5 text-center">상태</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-100 bg-white">
            <tr>
              <td colspan="10" class="text-center py-16 text-slate-400">
                <i class="fa-solid fa-circle-notch fa-spin text-2xl text-indigo-600 mb-2"></i>
                <p>최신 데이터를 불러오는 중입니다...</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Footer info -->
    <footer class="text-center text-xs text-slate-400 py-4">
      식품의약품안전처(식품안전나라) 실시간 연동 포털 &middot; givensik.space
    </footer>

  </main>

  <script>
    let currentRegion = 'seoul';
    let rawData = [];

    async function fetchData() {
      const icon = document.getElementById('refreshIcon');
      icon.classList.add('fa-spin');

      try {
        const res = await fetch(`/api/businesses?sido=${currentRegion}&count=20`);
        const json = await res.json();
        if (json.success) {
          rawData = json.data;
          document.getElementById('lastUpdated').innerText = new Date(json.updated_at).toLocaleTimeString('ko-KR');
          renderTable(rawData);
        } else {
          showError('데이터를 가져오는 중 오류가 발생했습니다: ' + json.error);
        }
      } catch (err) {
        showError('서버 연결 실패');
      } finally {
        icon.classList.remove('fa-spin');
      }
    }

    function formatTime(isoStr) {
      if (!isoStr) return '-';
      const d = new Date(isoStr);
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      const time = d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
      return `${m}-${day} ${time}`;
    }

    function renderTable(items) {
      const tbody = document.getElementById('tableBody');
      if (!items || items.length === 0) {
        tbody.innerHTML = '<tr><td colspan="10" class="text-center py-12 text-slate-400 font-medium">조회된 데이터가 없습니다.</td></tr>';
        return;
      }

      tbody.innerHTML = items.map((item, idx) => `
        <tr class="hover:bg-slate-50/80 transition">
          <td class="py-3.5 pl-6 pr-3 font-medium text-slate-400">${idx + 1}</td>
          <td class="px-3 py-3.5 font-mono text-xs font-semibold whitespace-nowrap ${item.permit_date ? 'text-emerald-700' : 'text-slate-400'}">
            ${item.permit_date || 'I2500 외 업종'}
          </td>
          <td class="px-3 py-3.5 font-mono text-xs text-indigo-600 font-semibold whitespace-nowrap">
            <i class="fa-regular fa-clock mr-1 text-slate-400"></i>${formatTime(item.detected_at)}
          </td>
          <td class="px-3 py-3.5 font-mono text-slate-600 text-xs">${item.license_no || '-'}</td>
          <td class="px-3 py-3.5 font-semibold text-slate-900">${item.store_name}</td>
          <td class="px-3 py-3.5">
            <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium ${item.industry.includes('음식') ? 'bg-amber-50 text-amber-700' : 'bg-blue-50 text-blue-700'}">
              ${item.industry}
            </span>
          </td>
          <td class="px-3 py-3.5 text-slate-600">${item.district}</td>
          <td class="px-3 py-3.5 text-slate-600 text-xs max-w-xs truncate" title="${item.address}">${item.address}</td>
          <td class="px-3 py-3.5 text-slate-500">${item.representative || '-'}</td>
          <td class="px-3 py-3.5 text-center">
            <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700">
              ${item.status || '정상'}
            </span>
          </td>
        </tr>
      `).join('');
    }

    function filterData() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      if (!q) {
        renderTable(rawData);
        return;
      }
      const filtered = rawData.filter(item => 
        (item.store_name && item.store_name.toLowerCase().includes(q)) ||
        (item.district && item.district.toLowerCase().includes(q)) ||
        (item.address && item.address.toLowerCase().includes(q)) ||
        (item.license_no && item.license_no.includes(q))
      );
      renderTable(filtered);
    }

    function setRegion(region) {
      currentRegion = region;
      ['all', 'seoul', 'gyeonggi'].forEach(r => {
        const btn = document.getElementById(`tab-${r}`);
        if (r === region) {
          btn.className = 'px-4 py-2 rounded-lg bg-white text-indigo-600 shadow-sm transition';
        } else {
          btn.className = 'px-4 py-2 rounded-lg text-slate-600 hover:text-slate-900 transition';
        }
      });
      fetchData();
    }

    function downloadCSV() {
      if (!rawData || rawData.length === 0) return alert('다운로드할 데이터가 없습니다.');
      const headers = ['순번', '식약처허가일(PRMS_DT)', '최초감지시각', '인허가번호', '상호명', '업종', '관할지자체', '주소', '대표자', '상태'];
      const rows = rawData.map((item, idx) => [
        idx + 1,
        `"${item.permit_date || ''}"`,
        `"${formatTime(item.detected_at)}"`,
        `"${item.license_no}"`,
        `"${item.store_name}"`,
        `"${item.industry}"`,
        `"${item.district}"`,
        `"${item.address}"`,
        `"${item.representative}"`,
        `"${item.status}"`
      ]);
      const csvContent = '\uFEFF' + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `foodsafety_${currentRegion}_${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
    }

    function showError(msg) {
      document.getElementById('tableBody').innerHTML = `
        <tr>
          <td colspan="9" class="text-center py-12">
            <div class="inline-flex flex-col items-center justify-center gap-3">
              <i class="fa-solid fa-triangle-exclamation text-amber-500 text-3xl"></i>
              <p class="text-slate-700 font-medium">${msg}</p>
              <button onclick="fetchData()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-semibold shadow-sm transition">
                <i class="fa-solid fa-rotate-right mr-1.5"></i>다시 불러오기
              </button>
            </div>
          </td>
        </tr>`;
    }

    // Initialize
    fetchData();
  </script>
</body>
</html>
